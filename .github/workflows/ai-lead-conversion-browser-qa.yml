name: AI lead conversion browser QA
on:
  push:
    branches: [feature/ai-consent-spam-privacy-20261111]
    paths:
      - scripts/ai-lead-conversion-browser-qa.mjs
      - .github/workflows/ai-lead-conversion-browser-qa.yml
      - public/ai-lead-wizard.js
      - public/ai-lead-wizard.css
      - public/business-console.js
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-save --no-audit --no-fund playwright @axe-core/playwright
      - name: Test consented AI lead, CRM source and quotation pricing on mobile and desktop
        env:
          PREVIEW_URL: https://6af49f4bfd57ecc564f34578--mzansi-digital-ventures.netlify.app
        run: node scripts/ai-lead-conversion-browser-qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-lead-conversion-screenshots
          path: qa-screenshots/*.png
          if-no-files-found: ignore
