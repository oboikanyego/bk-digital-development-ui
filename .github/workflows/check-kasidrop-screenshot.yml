name: Diagnose KasiDrop screenshot in live portfolios
on:
  push:
    branches: [fix/kasidrop-screenshot-visibility]
    paths:
      - .github/workflows/check-kasidrop-screenshot.yml
      - scripts/check-kasidrop-screenshot.mjs
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-audit --no-fund playwright
      - run: npx playwright install --with-deps chromium
      - name: Check rendering, asset delivery and mobile visibility
        run: node scripts/check-kasidrop-screenshot.mjs
