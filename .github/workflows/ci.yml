name: Frontend checks
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: node --check public/app.js && node --check public/admin.js && node --check public/admin-login.js && node --check netlify/functions/api-proxy.mjs
      - run: npm test
      - run: npm run build
