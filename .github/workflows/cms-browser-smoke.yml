name: CMS browser smoke test
on:
  push:
    branches: [feature/visual-site-cms-cloudinary]
    paths:
      - .github/workflows/cms-browser-smoke.yml
      - scripts/cms-browser-smoke.mjs
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-audit --no-fund playwright
      - run: npx playwright install --with-deps chromium
      - run: node scripts/cms-browser-smoke.mjs
