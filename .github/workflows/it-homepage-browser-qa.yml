name: IT homepage preview browser QA
on:
  push:
    branches: [feature/it-focused-homepage-refresh-20261111]
    paths:
      - scripts/homepage-browser-qa.mjs
      - .github/workflows/it-homepage-browser-qa.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-save --no-audit --no-fund playwright @axe-core/playwright
      - run: npx playwright install --with-deps chromium
      - name: Validate homepage preview desktop, mobile and accessibility
        env:
          PREVIEW_URL: https://6af41b13a43f243b510d0fd4--mzansi-digital-ventures.netlify.app
        run: node scripts/homepage-browser-qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: redesigned-homepage-screenshots
          path: qa-screenshots/*.png
          if-no-files-found: ignore
