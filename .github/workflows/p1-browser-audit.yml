name: P1 end-to-end browser and accessibility audit
on:
  push:
    branches: [feature/p1-crm-documents-cms-quality]
    paths:
      - scripts/p1-browser-audit.mjs
      - .github/workflows/p1-browser-audit.yml
      - public/site-view.js
      - public/site-view.css
      - public/business-console.css
      - public/advanced-settings.js
      - public/admin/**
      - public/index.html
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-save --no-audit --no-fund playwright @axe-core/playwright
      - run: npx playwright install --with-deps chromium
      - name: Run browser and WCAG checks against Netlify preview
        env:
          AUDIT_BASE_URL: https://6af3469fe4f609fbc6411524--mzansi-digital-ventures.netlify.app
        run: node scripts/p1-browser-audit.mjs
