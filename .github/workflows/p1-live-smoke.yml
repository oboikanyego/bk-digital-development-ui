name: P1 deployed backend and frontend smoke checks
on:
  push:
    branches: [feature/p1-crm-documents-cms-quality, main]
    paths:
      - scripts/p1-live-smoke.mjs
      - .github/workflows/p1-live-smoke.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify production Render and Netlify preview (read-only)
        env:
          SMOKE_UI_URL: https://6af347f633b3b4f9489635e6--mzansi-digital-ventures.netlify.app
        run: node scripts/p1-live-smoke.mjs
