name: Unified dropdowns browser QA
on:
  push:
    branches: [feature/unified-responsive-dropdowns-20261111]
    paths:
      - scripts/unified-select-browser-qa.mjs
      - .github/workflows/unified-select-browser-qa.yml
      - public/unified-select.js
      - public/unified-select.css
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-save --no-audit --no-fund playwright @axe-core/playwright
      - run: npx playwright install --with-deps chromium
      - name: Test desktop and mobile contact, dynamic selects, admin and accessibility
        env:
          PREVIEW_URL: https://6af42d5881959ddb11b7864d--mzansi-digital-ventures.netlify.app
        run: node scripts/unified-select-browser-qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unified-dropdown-screenshots
          path: qa-screenshots/*.png
          if-no-files-found: ignore
