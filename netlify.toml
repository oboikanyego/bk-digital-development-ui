[build]
  command = "npm run build"
  publish = "public"
  functions = "netlify/functions"
[functions]
  node_bundler = "esbuild"
# Migration: redirect only requests sent to the legacy hostname. Keep that Netlify site active.
[[redirects]]
  from = "https://bk-digital-development.netlify.app/*"
  to = "https://mzansi-digital-ventures.netlify.app/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/admin"
  to = "/admin/login/"
  status = 301
  force = true
[[redirects]]
  from = "/admin/"
  to = "/admin/login/"
  status = 301
  force = true
[[redirects]]
  from = "/admin.html"
  to = "/admin/login/"
  status = 301
  force = true
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api-proxy"
  status = 200
  force = true
[[headers]]
  for = "/admin/*"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex, nofollow"
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
