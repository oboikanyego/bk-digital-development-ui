[build]
  command = "npm run build"
  publish = "public"
  functions = "netlify/functions"
[functions]
  node_bundler = "esbuild"
# This site serves the new branded hostname.
# Old-host redirects must be hosted on the old Netlify site, if it is restored.
[[redirects]]
  from = "/admin"
  to = "/admin/login/"
  status = 301
  force = true
[[redirects]]
  from = "/admin/"
  to = "/admin/login/"
  status = 301
  force = true
[[redirects]]
  from = "/admin.html"
  to = "/admin/login/"
  status = 301
  force = true
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api-proxy"
  status = 200
  force = true
[[headers]]
  for = "/admin/*"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex, nofollow"
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
